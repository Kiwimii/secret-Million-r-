name: Apply meta V2 hardening UI

on:
  push:
    branches: [agent/meta-v2-hardening]
    paths:
      - ".github/workflows/apply-meta-v2-hardening-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-v2-hardening
      - name: Patch host safeguards and score visibility
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/demo/MetaGameApp.tsx')
          text = path.read_text()

          old_draw = '''<button onClick={() => void run("draw", () => controller.drawMillionaire(Boolean(round.millionaireId)))} disabled={!['lobby','round_setup'].includes(view.phase)}>{round.millionaireId ? "Notfall: neu auslosen" : "Millionär zufällig auslosen"}</button>'''
          new_draw = '''<button onClick={() => {\n                const redraw = Boolean(round.millionaireId);\n                if (redraw && !window.confirm("Die bisherige Rollenfreigabe wird ungültig. Millionär wirklich zufällig neu auslosen?")) return;\n                void run("draw", () => controller.drawMillionaire(redraw));\n              }} disabled={['voting_open','reveal_ready','report','role_decision','finished'].includes(view.phase)}>{round.millionaireId ? "Notfall: neu auslosen" : "Millionär zufällig auslosen"}</button>'''
          if old_draw not in text:
              raise SystemExit('Draw button pattern missing')
          text = text.replace(old_draw, new_draw)

          text = text.replace(
              '''<button onClick={() => void run("missionok", () => controller.setMissionStatus("completed"))} disabled={!round.challengePublished}>Mission erfüllt</button>\n              <button onClick={() => void run("missionfail", () => controller.setMissionStatus("failed"))} disabled={!round.challengePublished}>Mission gescheitert</button>\n              <button onClick={() => void run("neutral", () => controller.setMissionStatus("neutral"))} disabled={!round.challengePublished}>Neutral abschließen</button>''',
              '''<button onClick={() => void run("missionok", () => controller.setMissionStatus("completed"))} disabled={!round.challengePublished || !['challenge','mission_review'].includes(view.phase)}>Mission erfüllt</button>\n              <button onClick={() => void run("missionfail", () => controller.setMissionStatus("failed"))} disabled={!round.challengePublished || !['challenge','mission_review'].includes(view.phase)}>Mission gescheitert</button>\n              <button onClick={() => void run("neutral", () => controller.setMissionStatus("neutral"))} disabled={!round.challengePublished || !['challenge','mission_review'].includes(view.phase)}>Neutral abschließen</button>''',
          )

          text = text.replace(
              '''<div className={styles.inlineActions}><button onClick={() => void controller.setChallengeWinner("azur")}>Team Azur gewinnt</button><button onClick={() => void controller.setChallengeWinner("gold")}>Team Gold gewinnt</button></div>''',
              '''<div className={styles.inlineActions}><button disabled={!['challenge','mission_review'].includes(view.phase)} onClick={() => void controller.setChallengeWinner("azur")}>Team Azur gewinnt</button><button disabled={!['challenge','mission_review'].includes(view.phase)} onClick={() => void controller.setChallengeWinner("gold")}>Team Gold gewinnt</button></div>''',
          )

          text = text.replace(
              '''<div><strong>{member.displayName}</strong><small>{memberStatus(member)} · ab Runde {member.activeFromRound}</small></div>''',
              '''<div><strong>{member.displayName}</strong><small>{memberStatus(member)} · ab Runde {member.activeFromRound} · {member.points ?? 0} Punkte</small></div>''',
              1,
          )

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/MetaGameApp.tsx
          if git diff --cached --quiet; then
            echo "No UI changes needed."
          else
            git commit -m "Harden host controls and show scores"
            git push origin agent/meta-v2-hardening
          fi
