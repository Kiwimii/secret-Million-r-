name: Apply meta dashboard polish

on:
  push:
    branches: [agent/meta-dashboard-v2]
    paths:
      - ".github/workflows/apply-meta-component-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-dashboard-v2
      - name: Apply focused dashboard polish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          component = Path('app/demo/MetaGameApp.tsx')
          text = component.read_text()
          text = text.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useState } from "react";')
          text = text.replace(
              '''  malus: {\n    kind: "remove_self_vote",\n    title: "Riss in der Tarnung",\n    description: "Eine Stimme gegen dich kann nicht neutralisiert werden; der Malus entfernt stattdessen keinen Schutz.",\n    selectionMode: "none",\n  },''',
              '''  malus: {\n    kind: "points_penalty",\n    title: "Riss in der Tarnung",\n    description: "Bei Misserfolg wird dir ein Punkt abgezogen.",\n    amount: 1,\n    selectionMode: "none",\n  },''',
          )
          text = text.replace('Für Spieler und Spielleitung sichtbar', 'Nur für dich und die Spielleitung sichtbar')
          old = '''function FinalOverlay({ view, onClose }: { view: MetaGameView; onClose(): void }) {\n  const final = view.finalResult!;\n  return <Overlay title="Das große Finale" onClose={onClose} dramatic><div className={styles.finalWinner}><span>Gewinner</span><h3>{getName(view, final.winnerId)}</h3><p>{final.reason === "final_millionaire_survived" ? "Der Millionär hat die Finalrunde überlebt." : "Die Gesamtwertung entscheidet."}</p></div><div className={styles.leaderboard}>{final.leaderboard.map((entry, index) => <div key={entry.memberId}><b>#{index + 1}</b><span>{getName(view, entry.memberId)}</span><strong>{entry.points} Punkte</strong><small>{entry.correctGuesses} richtige Tipps</small></div>)}</div><p className={styles.muted}>Alle Rollen, Stimmen, Missionen und Punkte bleiben anschließend im Dashboard nachvollziehbar.</p></Overlay>;\n}\n'''
          new = '''function FinalOverlay({ view, onClose }: { view: MetaGameView; onClose(): void }) {\n  const final = view.finalResult!;\n  return <Overlay title="Das große Finale" onClose={onClose} dramatic>\n    <div className={styles.finalWinner}><span>Gewinner</span><h3>{getName(view, final.winnerId)}</h3><p>{final.reason === "final_millionaire_survived" ? "Der Millionär hat die Finalrunde überlebt." : "Die Gesamtwertung entscheidet."}</p></div>\n    <div className={styles.leaderboard}>{final.leaderboard.map((entry, index) => <div key={entry.memberId}><b>#{index + 1}</b><span>{getName(view, entry.memberId)}</span><strong>{entry.points} Punkte</strong><small>{entry.correctGuesses} richtige Tipps</small></div>)}</div>\n    <div className={styles.finalTimeline}>\n      {final.timeline.map((entry) => <article key={entry.roundNumber}>\n        <div><span>Runde {entry.roundNumber}</span><strong>{entry.roundNumber} Punkte</strong></div>\n        <h4>Millionär: {getName(view, entry.millionaireId)}</h4>\n        <p><b>Mission:</b> {entry.mission?.title ?? "Keine Mission"} · {entry.missionStatus === "completed" ? "erfüllt" : entry.missionStatus === "failed" ? "gescheitert" : "neutral"}</p>\n        <p><b>Ausgeschieden:</b> {getName(view, entry.eliminatedId)}{entry.winningTeam ? ` · Challenge: Team ${entry.winningTeam === "azur" ? "Azur" : "Gold"}` : ""}</p>\n        <div className={styles.finalVotes}>{entry.votes.length === 0 ? <small>Keine Stimmen abgegeben.</small> : entry.votes.map((vote) => <span key={`${entry.roundNumber}-${vote.voterId}`}>{getName(view, vote.voterId)} → {getName(view, vote.targetId)}</span>)}</div>\n        <div className={styles.finalScores}>{entry.scores.map((score) => <span key={`${entry.roundNumber}-${score.memberId}`}>{getName(view, score.memberId)}: {score.pointsAwarded >= 0 ? "+" : ""}{score.pointsAwarded}{score.correctGuess ? " ✓" : ""}</span>)}</div>\n      </article>)}\n    </div>\n    <p className={styles.muted}>Persönliche Ermittlungsnotizen bleiben auch im Finale privat.</p>\n  </Overlay>;\n}\n'''
          if old not in text and 'className={styles.finalTimeline}' not in text:
              raise SystemExit('Expected FinalOverlay block was not found')
          text = text.replace(old, new)
          component.write_text(text)

          css = Path('app/demo/meta-game.module.css')
          css_text = css.read_text()
          marker = '.finalTimeline{'
          if marker not in css_text:
              css_text += '''\n.finalTimeline{display:grid;gap:12px;margin-top:20px}.finalTimeline article{background:#0d1119;border:1px solid #2b3442;border-radius:14px;padding:14px}.finalTimeline article>div:first-child{display:flex;justify-content:space-between;color:#d8b466;text-transform:uppercase;letter-spacing:.08em;font-size:11px}.finalTimeline h4{font-family:Georgia,serif;font-size:21px;margin:10px 0}.finalTimeline p{color:#bbc2ce;margin:6px 0}.finalVotes,.finalScores{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.finalVotes span,.finalScores span,.finalVotes small{background:#171d28;border:1px solid #303a49;border-radius:999px;padding:6px 9px;font-size:11px;color:#d9dde5}\n'''
              css.write_text(css_text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/MetaGameApp.tsx app/demo/meta-game.module.css
          if git diff --cached --quiet; then
            echo "Dashboard already polished."
          else
            git commit -m "Polish final dashboard experience"
            git push origin agent/meta-dashboard-v2
          fi
