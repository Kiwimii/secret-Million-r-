name: Run V2 diagnosis

on:
  push:
    branches: [agent/meta-v2-diagnose]
    paths:
      - ".github/workflows/run-meta-v2-diagnosis.yml"
      - "scripts/diagnose-meta-v2.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-v2-diagnose
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Resolve public Supabase key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            --output api-keys.json
          publishable_key=$(node <<'NODE'
          const fs = require('node:fs');
          const keys = JSON.parse(fs.readFileSync('api-keys.json', 'utf8'));
          const key = keys.find((item) => item.type === 'publishable') ?? keys.find((item) => item.name === 'anon');
          if (!key?.api_key) process.exit(1);
          process.stdout.write(key.api_key);
          NODE
          )
          echo "::add-mask::$publishable_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_ID}.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"
      - name: Run stepwise V2 flow
        id: flow
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/diagnose-meta-v2.cjs 2>&1 | tee meta-v2-diagnosis.log
      - name: Record exact diagnosis
        if: always()
        env:
          FLOW_OUTCOME: ${{ steps.flow.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Meta V2 Diagnose"
            echo
            echo "- Ergebnis: $FLOW_OUTCOME"
            echo "- Zeitpunkt: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 120 meta-v2-diagnosis.log
            echo '```'
          } > docs/META_V2_DIAGNOSIS.md
          git add docs/META_V2_DIAGNOSIS.md
          git commit -m "Record Meta V2 diagnosis"
          git push origin agent/meta-v2-diagnose
      - name: Fail diagnosis
        if: steps.flow.outcome != 'success'
        run: exit 1

# Re-run after the event round overload migration.
