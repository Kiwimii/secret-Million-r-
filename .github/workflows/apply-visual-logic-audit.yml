name: Apply visual logic audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/visual-logic-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect request
        id: request
        shell: bash
        run: |
          if [[ -f .github/visual-logic-audit.request && -f scripts/apply-visual-logic-audit.py ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f .github/visual-logic-cleanup.request ]]; then
            echo "cleanup=true" >> "$GITHUB_OUTPUT"
          else
            echo "cleanup=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f .github/visual-logic-followup.request && -f scripts/apply-visual-logic-followup.py ]]; then
            echo "followup=true" >> "$GITHUB_OUTPUT"
          else
            echo "followup=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f .github/visual-logic-hotfix.request && -f scripts/apply-visual-logic-hotfix.py ]]; then
            echo "hotfix=true" >> "$GITHUB_OUTPUT"
          else
            echo "hotfix=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.request.outputs.apply == 'true' || steps.request.outputs.followup == 'true'
        with:
          node-version: 24

      - name: Apply initial audit changes
        if: steps.request.outputs.apply == 'true'
        run: |
          python scripts/apply-visual-logic-audit.py
          python scripts/apply-visual-logic-audit-live.py

      - name: Apply final follow-up
        if: steps.request.outputs.followup == 'true'
        run: python scripts/apply-visual-logic-followup.py

      - name: Apply final hotfix
        if: steps.request.outputs.hotfix == 'true'
        run: python scripts/apply-visual-logic-hotfix.py

      - name: Install dependencies
        if: steps.request.outputs.apply == 'true' || steps.request.outputs.followup == 'true'
        run: npm install

      - name: Validate patched branch
        if: steps.request.outputs.apply == 'true' || steps.request.outputs.followup == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Remove generated artifacts
        if: steps.request.outputs.cleanup == 'true'
        shell: bash
        run: |
          git fetch origin main
          rm -f package-lock.json
          git checkout origin/main -- next-env.d.ts tsconfig.json
          rm -f .github/visual-logic-cleanup.request

      - name: Commit branch changes
        if: steps.request.outputs.apply == 'true' || steps.request.outputs.cleanup == 'true' || steps.request.outputs.followup == 'true' || steps.request.outputs.hotfix == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize visual and game logic audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
