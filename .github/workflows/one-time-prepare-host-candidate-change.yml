name: Prepare focused host candidate change

on:
  push:
    branches:
      - agent/host-candidate-challenge-malus
    paths:
      - ".github/workflows/one-time-prepare-host-candidate-change.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-candidate-challenge-malus
          fetch-depth: 0

      - name: Patch transition verification and SQL alias
        shell: python
        run: |
          from pathlib import Path

          migration = Path("supabase/migrations/20260724153000_host_candidate_challenge_malus.sql")
          sql = migration.read_text(encoding="utf-8")
          old_alias = "from unnest(rejected_ids || array[current_candidate]::uuid[]) rejected_id"
          new_alias = "from unnest(rejected_ids || array[current_candidate]::uuid[]) as rejected(rejected_id)"
          if sql.count(old_alias) != 1:
              raise SystemExit("SQL alias insertion point was not found exactly once.")
          migration.write_text(sql.replace(old_alias, new_alias), encoding="utf-8")

          workflow = Path(".github/workflows/verify-round-transition-finale.yml")
          text = workflow.read_text(encoding="utf-8")
          old = """                  const transition = await rpc(millionaire.client, 'submit_live_cork_decision', {
                    target_game_id: gameId,
                    requested_decision: decision,
                  });
                  if (transition?.transition?.advanced !== true) throw new Error(`Runde ${round + 1} startete nicht automatisch.`);
                  const nextState = await lookup(host, code);
                  if (Number(nextState.current_round) !== round + 1 || nextState.phase !== 'role_reveal') {
                    throw new Error(`Falscher Zustand nach Runde ${round}: ${nextState.current_round}/${nextState.phase}.`);
                  }
                  if (decision === 'release') {
                    const nextOverview = await rpc(host, 'get_live_host_game_overview', { target_game_id: gameId });
                    if (nextOverview.game.currentMillionaireMemberId === millionaireId) {
                      throw new Error('Zufällige Weitergabe behielt unerlaubt denselben Millionär.');
                    }
                  }
          """
          new = """                  const decisionResponse = await rpc(millionaire.client, 'submit_live_cork_decision', {
                    target_game_id: gameId,
                    requested_decision: decision,
                  });

                  let transition = decisionResponse?.transition;
                  if (decision === 'release') {
                    if (transition?.advanced || transition?.reason !== 'candidate_confirmation_required') {
                      throw new Error('Die zufällige Weitergabe startete ohne Andrés geheime Bestätigung.');
                    }
                    const firstCandidate = await rpc(host, 'get_live_next_millionaire_candidate', { target_game_id: gameId });
                    if (!firstCandidate.requiresHostConfirmation || firstCandidate.decision !== 'release') {
                      throw new Error('Der neue Millionär wartet nicht auf Andrés Bestätigung.');
                    }
                    await rpc(host, 'reroll_live_next_millionaire', { target_game_id: gameId });
                    const secondCandidate = await rpc(host, 'get_live_next_millionaire_candidate', { target_game_id: gameId });
                    if (secondCandidate.candidateMemberId === firstCandidate.candidateMemberId) {
                      throw new Error('Die Neu-Auslosung behielt denselben Millionär.');
                    }
                    const confirmed = await rpc(host, 'confirm_live_next_millionaire', { target_game_id: gameId });
                    transition = confirmed?.transition;
                  }

                  if (transition?.advanced !== true) throw new Error(`Runde ${round + 1} startete nicht nach der erforderlichen Freigabe.`);
                  const nextState = await lookup(host, code);
                  if (Number(nextState.current_round) !== round + 1 || nextState.phase !== 'role_reveal') {
                    throw new Error(`Falscher Zustand nach Runde ${round}: ${nextState.current_round}/${nextState.phase}.`);
                  }
                  if (decision === 'release') {
                    const nextOverview = await rpc(host, 'get_live_host_game_overview', { target_game_id: gameId });
                    if (nextOverview.game.currentMillionaireMemberId === millionaireId) {
                      throw new Error('Zufällige Weitergabe behielt unerlaubt denselben Millionär.');
                    }
                  }
          """
          if text.count(old) != 1:
              raise SystemExit("Transition verification block was not found exactly once.")
          workflow.write_text(text.replace(old, new), encoding="utf-8")

          Path(".github/workflows/one-time-prepare-host-candidate-change.yml").unlink()

      - name: Validate focused frontend change
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Validate migration contracts
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260724153000_host_candidate_challenge_malus.sql"
          grep -F "candidate_confirmation_required" "$migration"
          grep -F "reroll_live_next_millionaire" "$migration"
          grep -F "confirm_live_next_millionaire" "$migration"
          grep -F "penalty.penalty_votes" "$migration"
          grep -F "challenge_penalty_votes" "$migration"

      - name: Commit focused preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260724153000_host_candidate_challenge_malus.sql \
            .github/workflows/verify-round-transition-finale.yml \
            .github/workflows/one-time-prepare-host-candidate-change.yml
          git commit -m "Prepare host candidate confirmation flow"
          git push origin HEAD:agent/host-candidate-challenge-malus
