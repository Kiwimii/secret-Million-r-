name: Apply private report audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/private-round-report-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply requested patch
        run: python scripts/apply-private-report-audit.py

      - name: Install dependencies
        run: npm install

      - name: Validate patched branch
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-private-report-audit.py
          rm -f .github/private-report-audit.request
          rm -f package-lock.json
          git checkout origin/main -- next-env.d.ts tsconfig.json || true

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize private round reports and host audit trail"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
