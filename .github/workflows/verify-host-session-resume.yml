name: Verify host session resume

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-host-session-resume.yml"
      - "app/demo/HostResumeGateway.tsx"
      - "app/demo/layout.tsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-host-session-resume
  cancel-in-progress: true

jobs:
  verify-host-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Resolve Supabase browser key
        id: config
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            --output api-keys.json
          publishable_key=$(node <<'NODE'
          const fs = require('node:fs');
          const keys = JSON.parse(fs.readFileSync('api-keys.json', 'utf8'));
          const key = keys.find((item) => item.type === 'publishable')
            ?? keys.find((item) => item.name === 'anon');
          if (!key?.api_key) process.exit(1);
          process.stdout.write(key.api_key);
          NODE
          )
          echo "::add-mask::$publishable_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${SUPABASE_PROJECT_ID}.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

      - name: Verify host PIN takeover
        id: resume
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee host-resume.log
          const { createClient } = require('@supabase/supabase-js');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const makeClient = () => createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          );

          async function authenticate(client) {
            const result = await client.auth.signInAnonymously();
            if (result.error || !result.data.user) throw result.error ?? new Error('Anonyme Anmeldung fehlgeschlagen.');
          }

          async function removeGame(primary, fallback, gameId) {
            const first = await primary.rpc('delete_own_live_game', { target_game_id: gameId });
            if (!first.error) return;
            const second = await fallback.rpc('delete_own_live_game', { target_game_id: gameId });
            if (second.error) throw second.error;
          }

          async function runAttempt() {
            const originalHost = makeClient();
            const resumedHost = makeClient();
            let gameId;
            try {
              await authenticate(originalHost);
              const created = await originalHost.rpc('create_live_game', {
                game_title: `Spielleiter-Wiedereintritt ${Date.now()}`,
                host_pin: '2486',
              });
              if (created.error) throw created.error;
              const game = created.data?.[0];
              if (!game?.game_id || !game?.join_code) throw new Error('Testpartie konnte nicht erstellt werden.');
              gameId = game.game_id;
              const joinCode = String(game.join_code);

              await authenticate(resumedHost);
              const wrongPin = await resumedHost.rpc('resume_live_host', {
                raw_join_code: joinCode,
                host_pin: '9999',
              });
              if (!wrongPin.error) throw new Error('Eine falsche André-PIN wurde unerwartet akzeptiert.');

              const resumed = await resumedHost.rpc('resume_live_host', {
                raw_join_code: joinCode,
                host_pin: '2486',
              });
              if (resumed.error || String(resumed.data) !== String(gameId)) {
                throw resumed.error ?? new Error('Die bestehende Spielleiter-Sitzung konnte nicht übernommen werden.');
              }

              const newLookup = await resumedHost.rpc('lookup_live_game', { raw_join_code: joinCode });
              const newState = newLookup.data?.[0];
              if (newLookup.error || newState?.game_id !== gameId || newState?.is_host !== true) {
                throw newLookup.error ?? new Error('Das neue Gerät wurde nicht als Spielleitung verbunden.');
              }

              const oldLookup = await originalHost.rpc('lookup_live_game', { raw_join_code: joinCode });
              if (oldLookup.error || oldLookup.data?.[0]?.is_host !== false) {
                throw oldLookup.error ?? new Error('Die Spielleitung wurde nicht eindeutig auf das neue Gerät übertragen.');
              }

              await removeGame(resumedHost, originalHost, gameId);
              gameId = undefined;
              console.log('Spielleiter-Wiedereintritt erfolgreich: falsche PIN abgelehnt, korrekte PIN akzeptiert und Host-Rechte übertragen.');
            } catch (error) {
              if (gameId) {
                try { await removeGame(resumedHost, originalHost, gameId); } catch {}
              }
              throw error;
            }
          }

          async function main() {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                await runAttempt();
                return;
              } catch (error) {
                lastError = error;
                console.log(`Versuch ${attempt}/6 fehlgeschlagen: ${error?.message ?? error}`);
                await sleep(5000);
              }
            }
            throw lastError ?? new Error('Spielleiter-Wiedereintrittstest fehlgeschlagen.');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify frontend contract
        id: frontend
        continue-on-error: true
        run: |
          grep -F 'data-host-resume-version="host-pin-v1"' app/demo/layout.tsx
          grep -F 'data-host-resume-entry="start-page"' app/demo/HostResumeGateway.tsx
          grep -F 'Als Spielleiter wieder beitreten' app/demo/HostResumeGateway.tsx
          npm run typecheck
          npm run build

      - name: Record host resume status
        if: always()
        env:
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          status="erfolgreich"
          if [[ "$CONFIG_OUTCOME" != "success" || "$RESUME_OUTCOME" != "success" || "$FRONTEND_OUTCOME" != "success" ]]; then status="fehlgeschlagen"; fi
          {
            echo "# Spielleiter-Wiedereintritt-Prüfung"
            echo
            echo "- Status: $status"
            echo "- Zeitpunkt (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: $TESTED_SHA"
            echo "- Browser-Konfiguration: $CONFIG_OUTCOME"
            echo "- André-PIN und Übertragung der Spielleitung: $RESUME_OUTCOME"
            echo "- Startseitenoption, TypeScript und Produktionsbuild: $FRONTEND_OUTCOME"
            echo
            echo "## Letzte Diagnosezeilen"
            echo '```text'
            if [[ -f host-resume.log ]]; then tail -n 60 host-resume.log; else echo "Keine Testausgabe vorhanden."; fi
            echo '```'
          } > docs/HOST_RESUME_STATUS.md
          git add docs/HOST_RESUME_STATUS.md
          git commit -m "[skip ci] Record host session resume status" || exit 0
          git push origin main

      - name: Fail unsuccessful host resume verification
        if: always() && (steps.config.outcome != 'success' || steps.resume.outcome != 'success' || steps.frontend.outcome != 'success')
        run: exit 1
