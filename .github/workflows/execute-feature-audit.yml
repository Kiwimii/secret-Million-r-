name: Execute feature audit

on:
  push:
    branches: [agent/intro-stability-audit]
    paths:
      - ".github/workflows/apply-intro-stability-audit.yml"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intro-stability-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute embedded patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-intro-stability-audit.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'embedded-audit.py', 'exec'))
          PY
      - name: Install and validate
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/AkteMidasApp.tsx lib/meta/useMetaGame.ts scripts/verify-akte-midas-live.cjs
          git commit -m "Slow intro and harden game stability"
          git push origin agent/intro-stability-audit
