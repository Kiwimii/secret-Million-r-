  }, []);'''
          new_load = '''  const load = useCallback(async (target?: MetaIdentity) => {
    const active = target ?? identityRef.current;
    const client = clientRef.current;
    if (!client || !active) return;
    const requestId = ++loadSequenceRef.current;
    const next = await rpc<MetaGameView>(client, "meta_get_game_view", {
      target_game_id: active.gameId,
    });
    if (requestId !== loadSequenceRef.current || identityRef.current?.gameId !== active.gameId) return;
    setView((current) => !current || current.gameId !== next.gameId || next.revision >= current.revision ? next : current);
    setError(undefined);
  }, []);'''
          hook = replace_once(hook, old_load, new_load, 'stale load protection')
          hook = replace_once(hook,
              '      setError(message);\n      throw caught;\n',
              '      setError(message);\n',
