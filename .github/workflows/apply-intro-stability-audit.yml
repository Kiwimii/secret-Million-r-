    for (const voter of roundOneVoters) {''',
              '''    const alternateTarget = roundOneVoters.find((member) => member.id !== millionaireOne && member.id !== effectTarget.id);
    assert(alternateTarget, 'No distinct target available for deterministic round-one tally.');
    for (const voter of roundOneVoters) {''',
              'deterministic eliminated millionaire')
          live = replace_once(live,
              '''    const eliminatedOne = roundOneResult.eliminatedId;

    await rpc(host, 'meta_host_publish_result' ''',
