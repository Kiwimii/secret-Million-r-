              '''  async function run(name: string, action: () => Promise<void>) {
    if (busyRef.current) return;
    busyRef.current = true;
    setBusyAction(name);
    try { await action(); } catch { /* useMetaGame exposes the actionable error in the dashboard */ }
    finally { busyRef.current = false; setBusyAction(undefined); }
  }
''',
              'host action lock')
          app = replace_once(app,
              '  const submitted = activeCandidates.filter((member) => member.voteSubmitted).length;\n',
              '  const submitted = activeCandidates.filter((member) => member.voteSubmitted).length;\n  const isBusy = Boolean(busyAction);\n',
              'host busy state')
          app = app.replace('disabled={!\'lobby\',\'round_setup\'.includes(view.phase) || busyAction === "configure"}', 'disabled={isBusy || ![\'lobby\',\'round_setup\'].includes(view.phase)}')
          app = app.replace("disabled={['voting_open','reveal_ready','report','role_decision','finished'].includes(view.phase)}", "disabled={isBusy || ['voting_open','reveal_ready','report','role_decision','finished'].includes(view.phase)}")
          app = app.replace('disabled={!round.millionaireId || Boolean(round.roleReleased)}', 'disabled={isBusy || !round.millionaireId || Boolean(round.roleReleased)}')
          app = app.replace('disabled={!round.roleReleased || Boolean(round.missionPublished)}', 'disabled={isBusy || !round.roleReleased || Boolean(round.missionPublished)}')
          app = app.replace('disabled={!round.missionPublished || Boolean(round.challengePublished)}', 'disabled={isBusy || !round.missionPublished || Boolean(round.challengePublished)}')
          app = app.replace("disabled={!round.challengePublished || !['challenge','mission_review'].includes(view.phase)}", "disabled={isBusy || !round.challengePublished || !['challenge','mission_review'].includes(view.phase)}")
          app = app.replace("disabled={!['completed','failed','neutral'].includes(round.missionStatus ?? \"pending\") || view.phase === \"voting_open\"}", "disabled={isBusy || !round.winningTeam || !['completed','failed','neutral'].includes(round.missionStatus ?? \"pending\") || view.phase === \"voting_open\"}")
          app = app.replace('disabled={view.phase !== "voting_open"}', 'disabled={isBusy || view.phase !== "voting_open"}')
          app = app.replace('disabled={!round.result}', 'disabled={isBusy || !round.result}')
          app = app.replace('disabled={!round.result || Boolean(round.resultPublished)}', 'disabled={isBusy || !round.result || Boolean(round.resultPublished)}')
          app = app.replace('disabled={!round.resultPublished}', 'disabled={isBusy || !round.resultPublished}')
          app = app.replace("disabled={!['challenge','mission_review'].includes(view.phase)} onClick={() => void controller.setChallengeWinner(\"azur\")}", "disabled={isBusy || !['challenge','mission_review'].includes(view.phase)} onClick={() => void run(\"challenge-azur\", () => controller.setChallengeWinner(\"azur\"))}")
          app = app.replace("disabled={!['challenge','mission_review'].includes(view.phase)} onClick={() => void controller.setChallengeWinner(\"gold\")}", "disabled={isBusy || !['challenge','mission_review'].includes(view.phase)} onClick={() => void run(\"challenge-gold\", () => controller.setChallengeWinner(\"gold\"))}")

          effect_start = app.index('function EffectSelection(')
          effect_end = app.index('function PlayerDashboard(', effect_start)
          effect_block = '''function EffectSelection({ view, round, controller }: { view: MetaGameView; round: MetaRoundState; controller: ReturnType<typeof useMetaGame> }) {
  const effect = round.missionStatus === "completed" ? round.bonus : round.missionStatus === "failed" ? round.malus : undefined;
  const [voterId, setVoterId] = useState(round.effectSelection?.voterId ?? "");
  const [targetId, setTargetId] = useState(round.effectSelection?.targetId ?? "");
  useEffect(() => {
    setVoterId(round.effectSelection?.voterId ?? "");
    setTargetId(round.effectSelection?.targetId ?? "");
  }, [round.number, round.effectSelection?.voterId, round.effectSelection?.targetId]);
  if (!effect || effect.kind === "none" || effect.selectionMode === "none") return null;
  const selectable = view.members.filter((member) => member.attendanceStatus === "present" && member.competitionStatus === "eligible" && member.activeFromRound <= view.currentRound && member.id !== view.memberId);
  const requiresVoter = ["voter", "source_and_target"].includes(effect.selectionMode ?? "");
  const requiresTarget = ["target", "source_and_target"].includes(effect.selectionMode ?? "");
  const selectionComplete = (!requiresVoter || Boolean(voterId)) && (!requiresTarget || Boolean(targetId));
  return <div className={styles.effectSelection}><h4>Effektziel festlegen: {effect.title}</h4>{requiresVoter && <label>Betroffener Wähler<select value={voterId} onChange={(event) => setVoterId(event.target.value)}><option value="">Auswählen</option>{selectable.map((member) => <option value={member.id} key={member.id}>{member.displayName}</option>)}</select></label>}{requiresTarget && <label>Zielperson<select value={targetId} onChange={(event) => setTargetId(event.target.value)}><option value="">Auswählen</option>{selectable.map((member) => <option value={member.id} key={member.id}>{member.displayName}</option>)}</select></label>}<button disabled={!selectionComplete} onClick={() => void controller.setEffectSelection({ voterId, targetId })}>Auswahl verriegeln</button>{!selectionComplete && <small>Ohne vollständige Auswahl verfällt der Effekt beim Abstimmungsschluss.</small>}</div>;
}

'''
          app = app[:effect_start] + effect_block + app[effect_end:]

          app_start = app.index('export default function AkteMidasApp()')
          app_tail = '''export default function AkteMidasApp() {
  const controller = useMetaGame();
  const [storageReady, setStorageReady] = useState(false);
  const [introSeen, setIntroSeen] = useState(false);
  const briefingKey = controller.identity ? `secret-millionaer.akte-midas.briefing.${controller.identity.gameId}.${controller.identity.accessRole}` : "";
  const [briefingSeen, setBriefingSeen] = useState(false);
  const [briefingReady, setBriefingReady] = useState(false);
  useEffect(() => {
    setIntroSeen(window.localStorage.getItem(INTRO_STORAGE_KEY) === "seen");
    setStorageReady(true);
  }, []);
  useEffect(() => {
    if (!briefingKey) { setBriefingSeen(false); setBriefingReady(false); return; }
    setBriefingSeen(window.localStorage.getItem(briefingKey) === "seen");
    setBriefingReady(true);
  }, [briefingKey]);
  function closeIntro() { window.localStorage.setItem(INTRO_STORAGE_KEY, "seen"); setIntroSeen(true); }
  function closeBriefing() { if (briefingKey) window.localStorage.setItem(briefingKey, "seen"); setBriefingSeen(true); }
  if (!storageReady || !controller.ready || (controller.loading && !controller.identity)) return <main className={styles.loading}><MidasMark /><p>Sichere Verbindung wird hergestellt …</p><small>Vertrauen weiterhin deaktiviert.</small></main>;
  if (!controller.identity || !controller.view) return introSeen ? <EntryScreen controller={controller} /> : <IntroSequence onClose={closeIntro} />;
  const dashboard = controller.view.isHost ? <HostDashboard view={controller.view} controller={controller} /> : <PlayerDashboard view={controller.view} controller={controller} />;
  return <>{dashboard}{briefingReady && !briefingSeen && <OperationBriefing isHost={controller.view.isHost} onClose={closeBriefing} />}</>;
}
'''
          app = app[:app_start] + app_tail
          app_path.write_text(app)

          hook_path = Path('lib/meta/useMetaGame.ts')
          hook = hook_path.read_text()
          hook = replace_once(hook,
              '  const channelRef = useRef<RealtimeChannel | null>(null);\n',
              '  const channelRef = useRef<RealtimeChannel | null>(null);\n  const loadSequenceRef = useRef(0);\n',
              'load sequence ref')
          old_load = '''  const load = useCallback(async (target?: MetaIdentity) => {
    const active = target ?? identityRef.current;
    const client = clientRef.current;
    if (!client || !active) return;
