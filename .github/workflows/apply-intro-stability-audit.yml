      - name: Install dependencies
        run: npm install

      - name: Validate changes
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/AkteMidasApp.tsx lib/meta/useMetaGame.ts scripts/verify-akte-midas-live.cjs
          git commit -m "Slow intro and harden game stability"
          git push origin agent/intro-stability-audit
