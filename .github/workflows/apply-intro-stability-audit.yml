name: Apply intro and stability audit

on:
  push:
    branches: [agent/intro-stability-audit]
    paths:
      - ".github/workflows/apply-intro-stability-audit.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/intro-stability-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply focused code fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing patch target: {label}")
              return text.replace(old, new, 1)

          app_path = Path('app/demo/AkteMidasApp.tsx')
          app = app_path.read_text()
          app = replace_once(app,
              'import { useEffect, useMemo, useState } from "react";',
              'import { useEffect, useId, useMemo, useRef, useState } from "react";',
              'react imports')
          app = replace_once(app,
              'const INTRO_STORAGE_KEY = "secret-millionaer.akte-midas.intro.v1";\n',
              '''const INTRO_STORAGE_KEY = "secret-millionaer.akte-midas.intro.v1";
const INTRO_STEP_MS = 5200;
const INTRO_SCENES = [
  { code: "VERBINDUNG", title: "Sichere Verbindung wird hergestellt", body: "Verschlüsselung aktiv. Vertrauen weiterhin deaktiviert." },
  { code: "AKTE MIDAS", title: "Zugriff vorläufig genehmigt", body: "Eine Person in diesem Raum ist der Millionär. Die übrigen besitzen immerhin Meinungen." },
  { code: "PROTOKOLL", title: "Beobachten. Täuschen. Abstimmen.", body: "Wer richtig liegt, erhält Punkte. Wer falsch liegt, erhält Erfahrung. Die Zentrale bewertet beides unterschiedlich." },
  { code: "EINSATZ", title: "Jede Runde erhöht den Preis", body: "Missionen bleiben geheim. Verdächtigungen selten. Fehlentscheidungen werden dauerhaft archiviert." },
  { code: "FREIGABE", title: "Vertrauen ist gestattet", body: "Beweise werden bevorzugt." },
] as const;
''',
              'intro constants')
          app = replace_once(app,
              'function MidasMark({ compact = false }: { compact?: boolean }) {\n  return (',
              'function MidasMark({ compact = false }: { compact?: boolean }) {\n  const gradientId = useId().replace(/:/g, "");\n  return (',
              'unique midas gradient')
          app = app.replace('id="midasGold"', 'id={gradientId}')
          app = app.replace('stroke="url(#midasGold)"', 'stroke={`url(#${gradientId})`}')
          app = replace_once(app,
              'function OperativeSilhouettes() {\n  return (',
              'function OperativeSilhouettes() {\n  const gradientId = useId().replace(/:/g, "");\n  return (',
              'unique silhouettes gradient')
          app = app.replace('id="fadeAgents"', 'id={gradientId}')
          app = app.replace('fill="url(#fadeAgents)"', 'fill={`url(#${gradientId})`}')
          app = replace_once(app,
              '  dramatic?: boolean;\n}) {\n  return (',
              '''  dramatic?: boolean;
}) {
  useEffect(() => {
    const onKeyDown = (event: KeyboardEvent) => {
      if (event.key === "Escape") onClose();
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [onClose]);
  return (''',
              'overlay escape handling')

          intro_start = app.index('function IntroSequence(')
          intro_end = app.index('function OperationBriefing(', intro_start)
          intro_block = '''function IntroSequence({ onClose }: { onClose(): void }) {
  const [step, setStep] = useState(0);
  useEffect(() => {
    if (step >= INTRO_SCENES.length - 1) return;
    let timer: number | undefined;
    const schedule = () => {
      if (document.visibilityState === "visible") {
        timer = window.setTimeout(() => setStep((current) => Math.min(current + 1, INTRO_SCENES.length - 1)), INTRO_STEP_MS);
      }
    };
    const onVisibilityChange = () => {
      if (timer) window.clearTimeout(timer);
      schedule();
    };
    schedule();
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => {
      if (timer) window.clearTimeout(timer);
      document.removeEventListener("visibilitychange", onVisibilityChange);
    };
  }, [step]);

  const scene = INTRO_SCENES[step];
  return (
    <main className={styles.intro}>
      <button className={styles.introClose} onClick={onClose} aria-label="Intro schließen">×</button>
      <div className={styles.introGrid} />
      <OperativeSilhouettes />
      <section className={styles.introContent} aria-live="polite">
        <MidasMark />
        <div className={styles.classifiedStamp}>VERTRAULICH</div>
        <p className={styles.kicker}>{scene.code}</p>
        <h1>{scene.title}</h1>
        <p>{scene.body}</p>
        <div className={styles.introProgress}>{INTRO_SCENES.map((_, index) => <button key={index} onClick={() => setStep(index)} className={index <= step ? styles.activeProgress : ""} aria-label={`Introszene ${index + 1}`} />)}</div>
        <button className={styles.primaryButton} onClick={onClose}>{step === INTRO_SCENES.length - 1 ? "Akte öffnen" : "Intro überspringen"}</button>
        <small>Die Zentrale wünscht einen diskreten Abend. Erfahrungsgemäß ist es dafür bereits zu spät.</small>
      </section>
    </main>
  );
}

'''
          app = app[:intro_start] + intro_block + app[intro_end:]
          app = app.replace('setDismissed([...dismissed, popup.id])', 'setDismissed((current) => current.includes(popup.id) ? current : [...current, popup.id])')

          app = replace_once(app,
              '  const [busyAction, setBusyAction] = useState<string>();\n',
              '  const [busyAction, setBusyAction] = useState<string>();\n  const busyRef = useRef(false);\n',
              'host busy ref')
          old_effect = '''  useEffect(() => {
    setMissionId(round.mission?.catalogId ?? MISSION_CATALOG.find((entry) => entry.title === round.mission?.title)?.catalogId ?? "M01");
    setChallengeId(round.challenge?.catalogId ?? CHALLENGE_CATALOG.find((entry) => entry.title === round.challenge?.title)?.catalogId ?? "C01");
    setBonusId(round.bonus?.catalogId ?? BONUS_CATALOG.find((entry) => entry.title === round.bonus?.title)?.catalogId ?? "B01");
    setMalusId(round.malus?.catalogId ?? MALUS_CATALOG.find((entry) => entry.title === round.malus?.title)?.catalogId ?? "X03");
  }, [view.currentRound, round.mission, round.challenge, round.bonus, round.malus]);'''
          new_effect = '''  const storedMissionId = round.mission?.catalogId ?? MISSION_CATALOG.find((entry) => entry.title === round.mission?.title)?.catalogId ?? "M01";
  const storedChallengeId = round.challenge?.catalogId ?? CHALLENGE_CATALOG.find((entry) => entry.title === round.challenge?.title)?.catalogId ?? "C01";
